<!doctype html><html><body><pre id="out">running</pre>
<script>
// 각 케이스: 축별 목표 극, 또는 강제 답변 배열
const cases = [];
["L","O"].forEach(r=>["S","T"].forEach(c=>["E","K"].forEach(a=>cases.push({want:r+c+a, poles:{R:r,C:c,A:a}}))));
// 3:2 경계: 리듬 축 5문항 중 L 3개만 → L, 나머지 축은 S,E
cases.push({want:"LSE", mixR:["L","O","L","O","L"], poles:{C:"S",A:"E"}});
cases.push({want:"OSE", mixR:["O","L","O","L","O"], poles:{C:"S",A:"E"}});
// 이전 버튼으로 답 바꾸기: 처음엔 전부 첫 선택지, 1번 문항만 돌아가 바꿈 (검증은 결과가 나오는지만)
const out=[]; let data;
function run(i){
  if(i>=cases.length){document.getElementById('out').textContent=out.join("\n")+"\nDONE";return;}
  const f=document.createElement('iframe'); f.style.width='360px'; f.style.height='700px'; document.body.appendChild(f);
  f.src='/routine-type/?from=qa';
  let stage=0;
  f.onload=async()=>{
    const w=f.contentWindow, d=w.document;
    if(stage===1){ out.push(`${cases[i].want} -> ${d.body.dataset.type} ${cases[i].want===d.body.dataset.type?'OK':'FAIL'}`); f.remove(); run(i+1); return; }
    stage=1;
    if(!data) data=await (await fetch('/routine-type/assets/data.json')).json();
    await new Promise(r=>setTimeout(r,300));
    d.getElementById('start-btn').click();
    let rIdx=0;
    for(let q=0;q<data.questions.length;q++){
      const Q=data.questions[q];
      let target = Q.axis==="R" && cases[i].mixR ? cases[i].mixR[rIdx++] : cases[i].poles[Q.axis];
      const key = Q.a[1]===target ? 'a' : 'b';
      d.getElementById('opt-'+key).click();
      await new Promise(r=>setTimeout(r,230));
    }
  };
}
run(0);
</script></body></html>
